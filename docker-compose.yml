version: '3.8'

services:
  # 1. PostgreSQL + PostGIS Spatial Database
  postgres:
    image: postgis/postgis:16-3.4
    container_name: firesync-postgis
    environment:
      POSTGRES_DB: firesync_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/10_init.sql
      - ./database/seed_sample_data.sql:/docker-entrypoint-initdb.d/20_seed.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d firesync_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Python FastAPI Scientific Processing Service
  scientific-service:
    build:
      context: ./scientific-service
      dockerfile: Dockerfile
    container_name: firesync-scientific
    environment:
      - FASTAPI_PORT=8000
      - FASTAPI_HOST=0.0.0.0
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=firesync_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - EXPRESS_BACKEND_URL=http://backend:5000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 3. Express.js API Gateway & Business Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: firesync-backend
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=firesync_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - FASTAPI_SERVICE_URL=http://scientific-service:8000
      - CORS_ORIGIN=http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - scientific-service
    restart: unless-stopped

  # 4. React + Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: firesync-frontend
    environment:
      - VITE_API_URL=http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
